{% extends "base.html" %}

{% block main_content %}
<h1>Login</h1>

<form method = 'POST' action = "{{url_for('login')}}">
    <p><label> Email <input type="text" required name="email" required></label></p>
    <p><label> Password <input type="password" required name="password" required></label></p>
    <p><button id = "submitbutton"
        type="submit">Login</button></p>

</form>

{% endblock %}
