{% extends "base.html" %}
{% block main_content %}
<h1>Update an Establishment</h1>
<p>You can add your establishment to an itinerary or leave a review by visiting its establishment page.</p>
<form method="POST" action="{{url_for('update_establishment', eid=eid)}}">
    <p><label for="name">Name:</label>
    <input type="text" name="name" value = "{{info['name']}}" required></p>
    <p><label for="website">Website:</label>
    <input type="text" name="website" value = "{{info['website']}}"></p>
    <p><label for="description">Description:</label>
    <textarea name="description" id = "review" rows="10" cols="30" value = "{{info['description']}}"></textarea></p>
    <p><input type="submit" name="submit-btn" value="Submit"></p>
</form>
{% endblock %}
