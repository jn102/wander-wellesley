{% extends "base.html" %}

{% block main_content %}
<h1>Create Account</h1>

<form method = 'POST' action = "{{url_for('create_account')}}">
    <p><label> Name <input type="text" required name="name"></label></p>
    <p><label> Email <input type="text" required name="email"></label></p>
    <p><label> Password <input type="text" required name="password"></label></p>
    <p><button id = "submitbutton"
        type="submit">Create Account</button></p>

</form>

{% endblock %}
