{% extends "base.html" %}
{% block main_content %}
<form method="POST" action="{{url_for('add_restaurant', eid=eid)}}">
    <p><label for="cuisine">Cuisine:</label>
    <input type="text" name="cuisine"></p>
    <p><label for="reservations">Do they take reservations?</label>
    <select name="reservations">
        <option value="None">Choose One</option>
        <option value=1>Yes</option>
        <option value=0>No</option>
        </select></p>
    <p><label for="outdoors">Do they have outdoor seating?</label>
    <select name="outdoors">
        <option value="None">Choose One</option>
        <option value=1>Yes</option>
        <option value=0>No</option>
        </select></p>
    <p><label for="credit">Do they take credit cards?</label>
    <select name="credit">
        <option value="None">Choose One</option>
        <option value=1>Yes</option>
        <option value=0>No</option>
        </select></p>
    <p><label for="hours">Hours:</label>
    <input type="text" name="hours"></p>
    <input type="submit" name="submit-btn" value="Submit">
</form>
{% endblock %}
