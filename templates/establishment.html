{% extends "base.html" %}

{% block main_content %}
<h1>{{establishment.name}}</h1>

<p>{{establishment.name}} is a {{establishment.type}} 
    in {{establishment.city}}, {{establishment.country}}</p>

<h2>Description:</h2>
<p>{{establishment.description}}</p>

<a href="{{url_for('add_review', eid = establishment.eid)}}">Add Review</a>
{% endblock %}
