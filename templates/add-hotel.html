{% extends "base.html" %}
{% block main_content %}
<form method="POST" action="{{url_for('add_hotel', eid=eid)}}">
    <label for="gym">Do they have a gym?</label>
    <select name="gym">
        <option value="None">Choose One</option>
        <option value=1>Yes</option>
        <option value=0>No</option>
        </select>
    <label for="breakfast">Do they have complimentary breakfast?</label>
    <select name="breakfast">
        <option value="None">Choose One</option>
        <option value=1>Yes</option>
        <option value=0>No</option>
        </select>
    <label for="pool">Do they have a pool?</label>
    <select name="pool">
        <option value="None">Choose One</option>
        <option value=1>Yes</option>
        <option value=0>No</option>
        </select>
    <label for="laundry">Do they have laundry available?</label>
    <select name="laundry">
        <option value="None">Choose One</option>
        <option value=1>Yes</option>
        <option value=0>No</option>
        </select>
    <label for="checkin">Check In Time:</label>
    <input type="text" name="checkin">
    <label for="checkout">Check Out Time:</label>
    <input type="text" name="checkout">
    <input type="submit" name="submit-btn" value="Submit">
</form>
{% endblock %}
