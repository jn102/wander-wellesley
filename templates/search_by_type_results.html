{% extends "base.html" %}

{% block main_content %}
<h1>{{type}}s</h1>
{%if establishments%}
<ol>
{%for place in establishments%}
<li><a href = "{{url_for('view_establishment', eid = place.eid)}}">{{place.name}}</a> is a {{place.type}} 
    in {{place.city}}, {{place.country}}</li>
{% endfor %}
</ol>
{% else %}
<p>No establishments found.</p>
{% endif %}
{% endblock %}
