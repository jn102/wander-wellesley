{% extends "base.html" %}
{% block main_content %}
<form method="POST" action="{{url_for('add_establishment')}}">
    <p><label for="name">Name:</label>
    <input type="text" name="name"></p>
    <p><label for="type">Type:</label>
    <select name="type">
        <option value="None">Choose One</option>
        <option value="Hotel">Hotel</option>
        <option value="Restaurant">Restaurant</option>
        <option value="Activity">Activity</option>
        </select></p>
    <p><label for="website">Website:</label>
    <input type="text" name="website"></p>
    <p><label for="country">Country:</label>
    <input type="text" name="country"></p>
    <p><label for="city">City:</label>
    <input type="text" name="city"></p>
    <p><label for="description">Description:</label>
    <textarea name="description" id = "review" rows="10" cols="30"></textarea></p>
    <p><input type="submit" name="submit-btn" value="Submit"></p>
</form>
{% endblock %}
