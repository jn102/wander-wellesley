{% extends "base.html" %}

{% block main_content %}
<h1>Search Establishments by City/Country</h1>
<form method="POST" action="{{url_for('search')}}">
    <p><label>City:
    <input type="text" name="city"></label></p>
    <p><label>Country:
    <input type="text" name="country"></label></p>
    <p><input type="submit" name="submit-btn" value="Submit"></p>
</form>

<h1>Search Establishments by Type</h1>
<form method="POST" action="{{url_for('search_by_type')}}">
    <label for="type">
        <select name="type" id="type"required>
        <option value="">Choose One</option>
        <option value="Hotel">Hotel</option>
        <option value="Restaurant">Restaurant</option>
        <option value="Activity">Activity</option>
        </select></label>
    <p><input type="submit" name="submit-btn" value="Submit"></p>
</form>
{% endblock %}
