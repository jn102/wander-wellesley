{% extends "base.html" %}
{% block main_content %}
<form method="POST" action="{{url_for('add_to_itinerary', eid=eid)}}">
    <p><label for="itinerary">What itinerary do you want to add to?</label>
    <select name="itinerary">
        <option value="None">Choose One</option>
        {% for itinerary in itineraries %}
        <option value={{itinerary.iid}}>{{itinerary.name}}</option>
        {% endfor %}
        </select></p>
    <p><input type="submit" name="submit-btn" value="Submit"></p>
</form>
{% endblock %}
