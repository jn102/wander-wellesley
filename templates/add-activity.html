{% extends "base.html" %}
{% block main_content %}
<form method="POST" action="{{url_for('add_activity', eid=eid)}}">
    <label for="outdoors">Is it outdoors?</label>
    <select name="outdoors">
        <option value="None">Choose One</option>
        <option value=1>Yes</option>
        <option value=0>No</option>
        </select>
    <label for="student">Is there a student discount?</label>
    <select name="student">
        <option value="None">Choose One</option>
        <option value=1>Yes</option>
        <option value=0>No</option>
        </select>
    <label for="ticket">Do they require tickets?</label>
    <select name="pool">
        <option value="None">Choose One</option>
        <option value='Reservation required'>Reservation Required</option>
        <option value='Ticket required'>Ticket Required</option>
        <option value='None required'>None Required</option>
        </select>
    <label for="hours">Hours:</label>
    <input type="text" name="hours">
    <input type="submit" name="submit-btn" value="Submit">
</form>
{% endblock %}
